<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DSH Browser Bridge</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark">D</span><strong>DSH Browser Bridge</strong></div>
      <p>把 DSH 设置页中的连接信息粘贴到这里。只有你主动配对后，DSH 才能操作这个 Chrome。</p>
      <label for="pairing">连接信息</label>
      <textarea id="pairing" rows="4" spellcheck="false" placeholder="ws://127.0.0.1:3080/…#…"></textarea>
      <button id="connect" type="button">连接 DSH</button>
      <div id="status" role="status">尚未连接</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
