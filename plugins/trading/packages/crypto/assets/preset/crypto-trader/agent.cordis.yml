# crypto 市场能力资源。
#
# connector/kit 行由 getPresetContribution() 读取；原生交易角色由
# @dshtrading/base/presets 向宿主追加注册。本包不安装独立预设，也不改变默认角色。
# 唯一组装入口为 plugins/trading/cordis.patch.yml。
# 数据源在宿主「设置 → 交易」中选择（dshtrading.markets.crypto.provider）；
# connector 根据 tradingMarketRouter 的当前配置激活，无需手改包内配置。
#
# 组合形态对照官方 standard preset（@deepseek-ai/dsh-agent-presets 内 standard/）：
# - 本文件是 AGENT-PLANE 组合：roster 每个 preset 常驻挂载一次，会话按 scope 父子加入；
#   preset 不持有审批/沙箱/模型路由（host 面职责，官方注释明确）。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是一名严谨的加密货币交易员，由 {{model}} 模型驱动，工作目录为 {{cwd}}。基于当前激活的
      交易所数据（默认 Binance；设置 dshtrading.markets.crypto.provider=okx 后为 OKX，
      OKX 默认打模拟盘 demo，env=live 才是真钱）的 ticker、资金费率等做客观、量化的分析；
      下单类操作一律默认 dry-run 模拟，liveTrading 关闭时直接拒绝实盘，未经用户明确确认
      绝不触碰真实资金；涉及杠杆、仓位与资金费率时逐项核对 crypto-risk-checklist 风控清单，
      并明确提示强平与费率风险；你给出的任何内容都不构成投资建议。每次会话开始时，先检查
      工作目录下是否已有交易日志目录 .trading-journal/：没有则提醒用户本工作区尚未建立交易
      日志，并调用 trading-notes-setup 技能创建骨架；已有则把本会话的重要操作按
      trading-notes-setup 的规范记入日志——agent 自己的操作入 agent 轨，用户的决定与手工
      操作代记入 human 轨，dry-run 一律标注。

# connector 行 provide 服务（tradingCryptoMarketData），按官方 standard preset 的硬性规则
# 必须包进 cordis:group + isolate（entry-local realm）：否则服务发布进 root realm，
# 与其他 preset 冲突，dsh-agent-presets 挂载时直接拒绝。（2026-08-29 主 agent 评审修复）
# 两连接器行并存、enabled 都 true——互斥由 settings 路由裁决（见头注），无需手工配置。
- id: dsh-trading-crypto-connector
  name: cordis:group
  group: true
  isolate:
    tradingCryptoMarketData: true
  config:
    - id: dsh-trading-crypto-connector-binance
      name: '@dshtrading/connector-binance'
      config:
        enabled: true
        dryRun: true
        liveTrading: false

- id: dsh-trading-crypto-connector-okx-group
  name: cordis:group
  group: true
  isolate:
    tradingCryptoMarketData: true
    tradingCryptoTrade: true
  config:
    - id: dsh-trading-crypto-connector-okx
      name: '@dshtrading/connector-okx'
      config:
        enabled: true
        env: demo
        dryRun: true
        liveTrading: false

- id: dsh-trading-crypto-connector-bybit-group
  name: cordis:group
  group: true
  isolate:
    tradingCryptoMarketData: true
    tradingCryptoTrade: true
  config:
    - id: dsh-trading-crypto-connector-bybit
      name: '@dshtrading/connector-bybit'
      config:
        enabled: true
        dryRun: true
        liveTrading: false

- id: dsh-trading-crypto-connector-ccxt-group
  name: cordis:group
  group: true
  isolate:
    tradingCryptoMarketData: true
    tradingCryptoTrade: true
  config:
    - id: dsh-trading-crypto-connector-ccxt
      name: '@dshtrading/connector-ccxt'
      config:
        enabled: true
        dryRun: true
        liveTrading: false


- id: dsh-trading-crypto-kit
  name: '@dshtrading/kit-crypto'
  config:
    dryRun: true
    liveTrading: false
